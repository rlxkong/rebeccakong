<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name – Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="wrap"><nav>
<a class="logo" href="#home"><i id="mono">Y</i><span id="navName"></span></a>
<a class="l" href="#home">Home</a><a class="l" href="#resume">Resume</a><a class="l" href="#projects">Projects</a><a class="l" href="#about">About</a>

</nav></div></header>

<main class="wrap" id="top">
<div class="hero" id="home">
<div><div class="eyebrow" id="title"></div><h1 id="name"></h1><p id="bio"></p><div class="links" id="links"></div>
<div class="addrow"><button class="btn" onclick="editProfile()">Edit profile &amp; links</button></div></div>
<div class="ph" id="photo"></div>
</div>

<section id="experience"><h2 class="sec">Experience</h2><div class="prog"><div class="track"><i id="bar"></i></div><button class="btn" id="play" onclick="togglePlay()" aria-label="Pause or play auto-scroll">❚❚</button><button class="btn" onclick="nudge(-1)" aria-label="Previous">←</button><button class="btn" onclick="nudge(1)" aria-label="Next">→</button></div>
<div id="exp"></div>
<p class="seeall"><a class="more" href="#resume">Open resume →</a></p>
<div class="addrow"><button class="btn p" onclick="editExp()">+ Add experience</button></div></section>

<section id="projects"><h2 class="sec">Projects</h2><div class="filters" id="filters"></div>
<div id="projs"></div>
<p class="seeall"><a class="more" href="#projects">Open projects page →</a></p>
<div class="addrow"><button class="btn p" onclick="editProj()">+ Add project</button></div></section>

<section id="about"><h2 class="sec">About</h2><div class="about"><p id="aboutTxt"></p></div>
<div class="cwrap"><h2 class="sec" id="cMe" style="margin-top:56px">Contact me</h2>
<div class="cform"><label for="cEmail">Your email</label><input id="cEmail" type="email" placeholder="you@example.com"><label for="cMsg">Message</label><textarea id="cMsg" placeholder="Say hi…"></textarea><div class="cact"><button class="btn p" onclick="sendMsg()">Send message</button><span id="cStat"></span></div></div></div></section>


<section id="resume"><h2 class="sec">Resume</h2><div class="rpdf"><img src="assets/resume-preview.jpg" alt="Rebecca Kong resume"></div>
<div class="dl"><button class="btn p" id="dlPdf" onclick="dlResume()">↓ Download resume (PDF)</button></div></section>
<section id="detail"><a class="more" href="#projects">← All projects</a><div id="dBody" style="margin-top:22px"></div></section>
<footer><span id="copy"></span><a href="#contact" style="font:500 14px Fredoka,sans-serif;color:var(--muted);text-decoration:none">Contact me</a></footer>
</main>


<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>

<script src="app.js"></script>
</body>
</html>
